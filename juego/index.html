<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Pirata+One&display=swap" rel="stylesheet" />
    <title>Réquiem de Ceniza</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
      canvas#juego { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); image-rendering: pixelated; image-rendering: crisp-edges; cursor: none; background: #000; }
      #nombre { position: absolute; display: none; font: 16px Georgia, serif; background: #0d0a08; color: #e8d8b0; border: 1px solid #6a5030; padding: 4px 8px; outline: none; z-index: 2; }
      #girar { display: none; position: absolute; inset: 0; z-index: 5; background: rgba(0,0,0,0.88); color: #e8d8b0; font: 18px Georgia, serif; text-align: center; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px; box-sizing: border-box; }
      #girar .tel { width: 54px; height: 92px; border: 3px solid #c8a060; border-radius: 9px; animation: girar 2.4s ease-in-out infinite; }
      #girar small { color: #9a8060; font-size: 14px; }
      @keyframes girar { 0%, 30% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
      @media (orientation: portrait) and (pointer: coarse) { html:not(.vertical-ok) #girar { display: flex; } }
    </style>
  </head>
  <body>
    <canvas id="juego"></canvas>
    <div id="girar" onclick="document.documentElement.classList.add('vertical-ok');try{sessionStorage.setItem('vertical-ok','1')}catch(e){}"><div class="tel"></div><div>Gira el teléfono<br>El Réquiem se juega en horizontal</div><small>o toca para seguir en vertical</small></div>
    <script>try{if(sessionStorage.getItem('vertical-ok'))document.documentElement.classList.add('vertical-ok')}catch(e){}</script>
    <input id="nombre" maxlength="16" autocomplete="off" spellcheck="false" />
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
