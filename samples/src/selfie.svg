<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dfe8ee"/><stop offset="1" stop-color="#b9cdb8"/></linearGradient>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 0.55"/></feComponentTransfer><feComposite in2="SourceGraphic" operator="in"/></filter>
    <radialGradient id="skin" cx="0.55" cy="0.4" r="0.7"><stop offset="0" stop-color="#d9a283"/><stop offset="1" stop-color="#b98266"/></radialGradient>
  </defs>
  <!-- fondo de foto: cielo, pérgola, árboles y juegos -->
  <rect width="600" height="800" fill="url(#sky)"/>
  <g fill="#f4f4f2" stroke="#c9ccd0" stroke-width="3">
    <rect x="-20" y="40" width="660" height="26" transform="rotate(-8 300 50)"/>
    <rect x="-20" y="140" width="660" height="22" transform="rotate(-6 300 150)"/>
    <rect x="-20" y="240" width="660" height="20" transform="rotate(-4 300 250)"/>
    <rect x="60" y="0" width="22" height="520"/>
  </g>
  <circle cx="70" cy="560" r="90" fill="#3f7d3a"/><circle cx="540" cy="520" r="110" fill="#4c8c3f"/>
  <rect x="440" y="520" width="80" height="60" fill="#d8402e"/><rect x="470" y="480" width="20" height="120" fill="#2f5fb0"/>
  <rect x="20" y="430" width="40" height="40" fill="#e9a21a"/>
