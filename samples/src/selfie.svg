  <path d="M215 338 Q245 322 282 334 L280 346 Q245 338 217 350 Z" fill="#231915"/>
  <path d="M318 334 Q355 322 385 338 L383 350 Q355 338 320 346 Z" fill="#231915"/>
  <ellipse cx="250" cy="372" rx="15" ry="9" fill="#2a1b14"/>
  <ellipse cx="350" cy="372" rx="15" ry="9" fill="#2a1b14"/>
  <path d="M300 360 L292 425 L312 425" stroke="#a5705a" stroke-width="5" fill="none"/>
</svg>
