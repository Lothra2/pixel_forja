  <path d="M60 800 Q80 640 220 600 L380 600 Q520 640 540 800 Z" fill="#1f2a55"/>
  <text x="400" y="740" font-family="Arial Black, Arial" font-weight="900" font-size="34" fill="#e9f36a">ENJOY</text>
  <!-- cuello -->
  <rect x="250" y="520" width="100" height="100" fill="#b98266"/>
  <!-- cabeza -->
  <ellipse cx="300" cy="380" rx="125" ry="160" fill="url(#skin)"/>
  <ellipse cx="176" cy="390" rx="18" ry="34" fill="#c08a6c"/><ellipse cx="424" cy="390" rx="18" ry="34" fill="#c08a6c"/>
  <!-- pelo corto oscuro -->
  <path d="M175 330 Q170 205 300 200 Q430 205 425 330 Q410 262 350 250 Q300 240 250 252 Q195 265 175 330 Z" fill="#2e211b"/>
  <!-- barba sal y pimienta -->
  <path d="M178 400 Q182 520 300 548 Q418 520 422 400 Q410 455 380 462 Q345 440 300 448 Q255 440 220 462 Q190 455 178 400 Z" fill="#7d7570"/>
  <path d="M178 400 Q182 520 300 548 Q418 520 422 400 Q410 455 380 462 Q345 440 300 448 Q255 440 220 462 Q190 455 178 400 Z" fill="#ffffff" filter="url(#grain)"/>
  <path d="M255 455 Q300 440 345 455 L340 470 Q300 462 260 470 Z" fill="#5e5752"/>
  <!-- boca -->
  <path d="M272 488 Q300 496 328 488" stroke="#8a4a46" stroke-width="7" fill="none"/>
